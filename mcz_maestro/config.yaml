name: "MCZ Maestro (locale)"
version: "1.5.3"
slug: "mcz_maestro_local"
description: "Controllo locale della stufa MCZ Maestro (senza cloud), con ventole canalizzate, via MQTT"
url: "https://github.com/azatoth77/ha-mcz-maestro-local"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto

# Credenziali MQTT fornite automaticamente dall'add-on Mosquitto
services:
  - mqtt:need

# Accesso a NetworkManager per il watchdog del Wi-Fi verso la stufa
host_dbus: true

options:
  mcz_ip: "192.168.120.1"
  mcz_port: 81
  device_name: "Stufa MCZ"
  topic_prefix: "Maestro"
  wifi_watchdog: true
  wifi_interface: "wlan0"

schema:
  mcz_ip: str
  mcz_port: port
  device_name: str
  topic_prefix: str
  wifi_watchdog: bool
  wifi_interface: str
